# Type check, with svelte-check's errors in the MR's Code Quality widget
check:
  image: node:24-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npx svelte-kit sync
    - npx svelte-check --output machine-verbose | npx svelte-check-reporter --output-file gl-codequality.json
  artifacts:
    # The report matters most when the check fails
    when: always
    reports:
      codequality: gl-codequality.json

# Lint, with eslint-formatter-gitlab, to compare its widget with svelte-check-reporter's
lint:
  image: node:24-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-codequality-eslint.json
  script:
    - npm ci
    - npx eslint src --format gitlab
  artifacts:
    when: always
    reports:
      codequality: gl-codequality-eslint.json
